<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Resultados IA</title>
    <link href="https://cdn.jsdelivr.net/npm/simple-datatables@7.1.2/dist/style.min.css" rel="stylesheet" />
    <link href="css/styles.css" rel="stylesheet" />
    <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
</head>

<body class="sb-nav-fixed">
    <nav class="sb-topnav navbar navbar-expand navbar-dark bg-dark">
        <a class="navbar-brand ps-3" href="#">Hospital</a>
    </nav>
    <div id="layoutSidenav">
        <div id="layoutSidenav_nav">
            <nav class="sb-sidenav accordion sb-sidenav-dark" id="sidenavAccordion">
                <div id="menu-container"></div>
            </nav>
        </div>
        <div id="layoutSidenav_content">
            <main>
                <div class="container-fluid px-4">
                    <h1 class="mt-4">Resultados IA</h1>
                    <table id="resultadosTable" class="table table-striped">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Exame</th>
                                <th>Paciente</th>
                                <th>Resultado IA</th>
                                <th>Data</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Dados via JS -->
                        </tbody>
                    </table>
                </div>
            </main>
        </div>
    </div>
    <script>
        fetch("/menu.html")
            .then(res => res.text())
            .then(data => document.getElementById("menu-container").innerHTML = data)
            .catch(err => console.error(err));
    </script>
</body>

</html>
